name: Deploy history quiz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: history-quiz/package-lock.json
      - name: Install dependencies
        working-directory: history-quiz
        run: npm ci
      - name: Build static preview
        working-directory: history-quiz
        env:
          VITE_STATIC_PREVIEW: 'true'
        run: |
          npm run check:runtime
          npx tsc
          npx vite build --base=/QuizMe/
          node scripts/prepare-sites-build.mjs
          node scripts/prepare-pages-build.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: history-quiz/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
